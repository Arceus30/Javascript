<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta http-equiv="X-UA-Compatible" content="ie=edge" />
        <title>Number Guessing Game</title>
        <style>
            * {
                box-sizing: border-box;
            }

            body {
                margin: 0;
                font-family: system-ui, sans-serif;
                color: black;
                background-color: white;
            }

            nav {
                display: flex;
                flex-wrap: wrap;
                align-items: center;
                justify-content: center;
                padding: 0.5rem;
                gap: 0.5rem;
                border-bottom: solid 1px #aaa;
                background-color: #eee;
            }

            nav a {
                display: inline-block;
                min-width: 9rem;
                padding: 0.5rem;
                border-radius: 0.2rem;
                border: solid 1px rgb(22, 22, 22);
                text-align: center;
                text-decoration: none;
                color: #1b1b1b;
            }

            nav a[aria-current="page"] {
                color: #000;
                background-color: #d4d4d4;
            }

            main {
                padding: 1rem;
            }

            h1 {
                font-weight: bold;
                font-size: 1.5rem;
            }

            .projects {
                display: flex;
                flex-direction: column;
            }

            .project-link {
                background-color: #fff;
                padding: 10px 30px;
                border-radius: 8px;
                color: #212121;
                text-decoration: none;
                border: 2px solid #212121;
                margin-top: 5px;
            }

            html {
                font-family: sans-serif;
            }

            body {
                width: 300px;
                max-width: 750px;
                min-width: 480px;
                margin: 0 auto;
                background-color: #212121;
            }

            .lastResult {
                color: white;
                padding: 7px;
            }

            .guesses {
                color: white;
                padding: 7px;
            }

            button {
                background-color: #141414;
                color: #fff;
                width: 250px;
                height: 50px;
                border-radius: 25px;
                font-size: 30px;
                border-style: none;
                margin-top: 30px;
                /* margin-left: 50px; */
            }

            #subt {
                background-color: #161616;
                color: #ffffff;
                width: 200px;
                height: 50px;
                border-radius: 10px;
                font-size: 20px;
                border-style: none;
                margin-top: 50px;
                /* margin-left: 75px; */
            }

            #guessField {
                color: #000;
                width: 250px;
                height: 50px;
                font-size: 30px;
                border-style: none;
                margin-top: 25px;

                /* margin-left: 50px; */
                border: 5px solid #6c6d6d;
                text-align: center;
            }

            #guess {
                font-size: 55px;
                /* margin-left: 90px; */
                margin-top: 120px;
                color: #fff;
            }

            .guesses {
                background-color: #7a7a7a;
            }

            #wrapper {
                box-sizing: border-box;
                text-align: center;
                width: 450px;
                height: 750px;
                background-color: #474747;
                color: #fff;
                font-size: 25px;
            }

            h1 {
                background-color: #161616;

                color: #fff;
                text-align: center;
            }

            p {
                font-size: 16px;
                text-align: center;
            }
        </style>
    </head>
    <body style="background-color: #212121; color: #fff">
        <nav>
            <a href="/" aria-current="page">Home</a>
            <a target="_blank" href="https://www.youtube.com/@chaiaurcode"
                >Youtube channel</a
            >
        </nav>
        <div id="wrapper">
            <h1>Number guessing game</h1>
            <p>Try and guess a random number between 1 and 100.</p>
            <p>You have 10 attempts to guess the right number.</p>
            <br />
            <form class="form">
                <label for="guessField" id="guess">Guess a number</label>
                <input type="text" id="guessField" class="guessField" />
                <input
                    type="submit"
                    id="subt"
                    value="Submit guess"
                    class="guessSubmit"
                />
            </form>
            <div class="resultParas">
                <p>Previous Guesses: <span class="guesses"></span></p>
                <p>Guesses Remaining: <span class="lastResult">10</span></p>
                <p class="lowOrHi"></p>
            </div>
        </div>
        <script>
            const form = document.querySelector(".form");
            const userGuess = form.querySelector("#guessField");
            const submit = form.querySelector("#subt");
            const prevGuess = document.querySelector(".guesses");
            const guessRem = document.querySelector(".lastResult");
            const lowOrHi = document.querySelector(".lowOrHi");
            const startOver = document.querySelector(".resultParas");
            const btn = document.createElement("button");
            btn.id = "restartGame";

            let randNum = Math.floor(Math.random() * 100) + 1;
            let guessCnt = 1;
            let playGame = true;

            if (playGame) {
                form.addEventListener("submit", (evt) => {
                    evt.preventDefault();
                    startGame();
                });
            }

            function restartGame() {
                const restartGame = document.querySelector("#restartGame");
                restartGame.addEventListener("click", (evt) => {
                    randNum = Math.floor(Math.random() * 100) + 1;
                    guessCnt = 1;
                    prevGuess.innerHTML = "";
                    guessRem.innerHTML = 10;
                    submit.removeAttribute("disabled");
                    submit.style.opacity = 1;
                    lowOrHi.innerHTML = "";
                    btn.remove();
                    playGame = true;
                });
            }

            function startGame() {
                let userGuessVal = parseInt(userGuess.value);

                if (isNaN(userGuessVal)) {
                    alert(`Invalid Input ${userGuessVal}`);
                } else if (userGuessVal < 1 || userGuessVal > 100) {
                    alert(`Guess ${userGuessVal} outside of range`);
                } else {
                    if (guessCnt == 10) {
                        updateGuessInp(userGuessVal);
                        showMessage("You used all your guesses");
                        endGame();
                    } else {
                        updateGuessInp(userGuessVal);
                        checkGuess(userGuessVal);
                    }
                }
            }

            function checkGuess(userGuessVal) {
                if (userGuessVal == randNum) {
                    showMessage("You guessed Correctly");
                    endGame();
                } else if (userGuessVal < randNum) {
                    showMessage("Guess Higher");
                } else {
                    showMessage("Guess Lower");
                }
            }

            function updateGuessInp(userGuessVal) {
                userGuess.value = "";
                prevGuess.textContent += `${userGuessVal}; `;
                guessCnt += 1;
                guessRem.innerHTML = `${11 - guessCnt >= 0 ? 11 - guessCnt : 0}`;
            }

            function showMessage(message) {
                lowOrHi.innerHTML = `<h4>${message}</h4>`;
            }

            function endGame() {
                userGuess.value = "";
                submit.style.opacity = 0.5;
                submit.setAttribute("disabled", "");
                btn.innerHTML = "<p>Restart Game</p>";
                btn.style.cursor = "pointer";
                startOver.appendChild(btn);
                restartGame();
            }
        </script>
    </body>
</html>
